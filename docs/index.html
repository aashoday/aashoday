<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0593c6; --white: #fcffff; --pink: var(--a1); --ink: #062a38; --tint: #e3f1f6;
    --h0: #e3f1f6; --h1: #9fd8ea; --h2: #4cb9dc; --h3: #0593c6; --h4: var(--a1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background-color: var(--white);
    background-image: linear-gradient(var(--tint) 1px, transparent 1px), linear-gradient(90deg, var(--tint) 1px, transparent 1px);
    background-size: 40px 40px;
    font: 15px/1.5 "Bricolage Grotesque", system-ui, sans-serif;
  }
  a { color: inherit; text-decoration-color: var(--pink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  a:hover { color: var(--pink); }
  a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .mono { font-family: "DM Mono", monospace; }
  main { max-width: 1160px; margin: 0 auto; padding: 36px 24px 28px; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
  .blk { border: 2.5px solid var(--ink); border-radius: 14px; background: var(--white); box-shadow: 6px 6px 0 var(--ink); padding: 22px 26px; min-width: 0; }
  h2 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .sub { margin: 0 0 16px; font-size: 14px; opacity: .75; }

  .hero { grid-column: span 8; background: var(--blue); border-radius: 26px 14px 14px 14px; padding: 24px 30px 20px; color: var(--ink); }
  .hero .top { display: flex; align-items: center; gap: 12px; font: 500 13px "DM Mono", monospace; }
  .hero .top img { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--white); }
  h1 { margin: 14px 0 0; font-size: clamp(52px, 9.5vw, 112px); line-height: .92; font-weight: 800; letter-spacing: -0.045em; color: var(--white); text-shadow: 5px 5px 0 var(--ink); }
  h1 i { display: inline-block; width: .42em; height: .09em; background: var(--pink); margin-left: .06em; box-shadow: 3px 3px 0 var(--ink); animation: blink 1s steps(1) infinite; }
  .tag { margin: 18px 0 14px; font-size: 21px; line-height: 1.3; font-weight: 700; color: var(--white); max-width: 30ch; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .links a { background: var(--white); border: 2.5px solid var(--ink); border-radius: 99px; padding: 3px 14px; font-weight: 700; text-decoration: none; box-shadow: 3px 3px 0 var(--ink); }
  .links a:hover { background: var(--pink); color: var(--white); }
  .curve { display: block; width: 100%; height: auto; margin-top: 8px; }
  .curve path { fill: none; stroke-linecap: round; stroke-width: 4; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.3, .6, .3, 1) forwards; }
  .curve .c1 { stroke: var(--white); }
  .curve .c2 { stroke: var(--ink); animation-delay: .25s; }
  .curve .dot { opacity: 0; animation: fade .3s 2.6s forwards; }
  .log { display: flex; flex-wrap: wrap; gap: 4px 22px; font: 500 12.5px "DM Mono", monospace; }
  .log b { font-weight: 500; color: var(--white); }

  .proof { grid-column: span 4; background: var(--pink); color: var(--white); border-radius: 14px 26px 14px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .proof .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 2px dashed rgba(252, 255, 255, .55); }
  .proof .row:last-child { border: 0; }
  .proof .row span { font: 500 13px "DM Mono", monospace; }
  .proof .row b { font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .proof .row.big b { font-size: 56px; text-shadow: 3px 3px 0 var(--ink); }

  .band { grid-column: 1 / -1; background: var(--ink); color: var(--white); border-radius: 10px; overflow: hidden; transform: rotate(-1deg); margin: 6px -10px; border: 2.5px solid var(--ink); }
  .track { display: flex; width: max-content; animation: slide 30s linear infinite; }
  .track span { display: inline-flex; align-items: center; gap: 10px; padding: 11px 26px; font: 500 15px "DM Mono", monospace; white-space: nowrap; }
  .track span::after { content: "✦"; color: var(--pink); margin-left: 26px; }
  .track svg { width: 26px; height: 26px; padding: 3px; background: var(--white); border-radius: 6px; }

  .oss { grid-column: span 12; padding: 0; overflow: hidden; }
  .oss .bar { background: var(--pink); color: var(--white); padding: 14px 26px; border-bottom: 2.5px solid var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .oss .bar h2 { margin: 0; display: flex; align-items: center; }
  .oss .bar p { margin: 0; font: 500 13px "DM Mono", monospace; }
  .oss .inner { padding: 8px 26px 18px; }
  .live { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--white); margin-right: 12px; position: relative; }
  .live::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--white); animation: ping 1.8s ease-out infinite; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 500 12.5px "DM Mono", monospace; opacity: .7; padding: 10px 12px 8px 0; }
  td { padding: 11px 12px 11px 0; border-top: 2px solid var(--tint); vertical-align: top; font-weight: 500; }
  tr:hover td { background: var(--tint); }
  td.repo { font: 500 13px "DM Mono", monospace; white-space: nowrap; }
  td.num { font: 500 13px "DM Mono", monospace; white-space: nowrap; }
  .star { background: var(--ink); color: var(--white); border-radius: 99px; padding: 1px 9px; }
  .add { color: #0a7c46; } .del { color: var(--pink); }
  .empty { padding: 18px 0 6px; }

  .projects { grid-column: span 12; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .proj { border: 2.5px solid var(--ink); border-radius: 12px; padding: 20px 24px; background: var(--white); box-shadow: 6px 6px 0 var(--blue); transition: transform .15s, box-shadow .15s; }
  .proj:hover { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--pink); }
  .proj h3 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .proj p { margin: 0 0 14px; font-size: 15.5px; }
  .pm { display: flex; gap: 8px; flex-wrap: wrap; font: 500 12.5px "DM Mono", monospace; }
  .pm span { border: 2px solid var(--ink); border-radius: 99px; padding: 1px 10px; }
  .pm .lang { background: var(--blue); color: var(--ink); }

  .skills { grid-column: span 7; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .tile { text-align: center; font: 500 12.5px "DM Mono", monospace; }
  .tile svg { display: block; width: 100%; max-width: 64px; aspect-ratio: 1; margin: 0 auto 6px; padding: 9px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); transition: transform .2s; }
  .tile:hover svg { transform: translateY(-5px) rotate(-6deg); box-shadow: 3px 8px 0 var(--pink); }

  .langs { grid-column: span 5; }
  .lbar { display: flex; height: 22px; border: 2.5px solid var(--ink); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .lbar span { display: block; transform-origin: left; animation: grow 1s cubic-bezier(.2, .8, .2, 1) both; }
  .leg { display: grid; gap: 4px; font: 500 13px "DM Mono", monospace; }
  .leg div { display: flex; align-items: center; gap: 8px; }
  .leg em { font-style: normal; margin-left: auto; }
  .sw { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 3px; flex: none; }

  .act { grid-column: span 12; }
  .heat { width: 100%; height: auto; display: block; }
  .heat text { fill: var(--ink); font: 500 10px "DM Mono", monospace; }
  .heat rect { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s ease forwards; }
  .foot { grid-column: span 12; text-align: right; font: 500 12px "DM Mono", monospace; opacity: .7; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes slide { to { transform: translateX(-50%); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes ping { to { transform: scale(2.6); opacity: 0; } }
  @media (max-width: 880px) {
    .hero, .proof, .skills, .langs { grid-column: span 12; }
    .projects { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(4, 1fr); }
    .scroll { overflow-x: auto; }
    .band { margin: 6px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .heat rect, .curve .dot { opacity: 1; }
    .curve path { stroke-dashoffset: 0; }
  }

  /* ---- v3: blue base, white secondary, hot pink as blurred hue ---- */
  :root { --ink: #04304a; --h0: rgba(252,255,255,.14); --h1: rgba(252,255,255,.38); --h2: rgba(252,255,255,.68); --h3: #fcffff; --h4: var(--a1); }
  body { color: var(--white); background: linear-gradient(165deg, #12a9de 0%, #0593c6 38%, #036a93 100%) fixed; }
  main { position: relative; z-index: 1; }
  .blob { position: fixed; border-radius: 50%; filter: blur(95px); background: var(--a1); pointer-events: none; z-index: 0; }
  .b1 { width: 540px; height: 540px; top: -150px; right: -100px; opacity: .6; animation: drift 18s ease-in-out infinite alternate; }
  .b2 { width: 440px; height: 440px; bottom: -160px; left: -120px; opacity: .45; animation: drift 24s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate(-70px, 60px) scale(1.18); } }
  a:hover { color: var(--white); text-decoration-color: var(--white); }
  .blk { background: rgba(252,255,255,.12); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1.5px solid rgba(252,255,255,.5); box-shadow: 0 24px 50px -22px rgba(var(--a1r),.65), inset 0 1px 0 rgba(255,255,255,.45); color: var(--white); }
  .hero { background: linear-gradient(150deg, rgba(252,255,255,.2), rgba(252,255,255,.07)); color: var(--white); }
  .hero .top img { border: 2px solid var(--white); }
  h1 { text-shadow: 0 0 46px rgba(var(--a1r),.95), 0 6px 30px rgba(3,70,100,.55); }
  h1 i { background: var(--pink); box-shadow: 0 0 22px 4px rgba(var(--a1r),.9); }
  .links a { background: var(--white); color: var(--ink); border: 0; box-shadow: 0 8px 20px -8px rgba(var(--a1r),.9); }
  .links a:hover { background: var(--pink); color: var(--white); }
  .curve g { stroke: rgba(252,255,255,.28); }
  .curve .c1 { stroke: var(--white); filter: drop-shadow(0 0 6px rgba(252,255,255,.8)); }
  .curve .c2 { stroke: var(--pink); filter: drop-shadow(0 0 7px rgba(var(--a1r),1)) drop-shadow(0 0 2px #fff); }
  .curve .dot { stroke: var(--white); }
  .proof { background: linear-gradient(160deg, rgba(var(--a1r),.82), rgba(var(--a1r),.42)); border-color: rgba(252,255,255,.6); box-shadow: 0 26px 60px -20px rgba(var(--a1r),.9), inset 0 1px 0 rgba(255,255,255,.5); }
  .proof .row.big b { text-shadow: 0 0 28px rgba(252,255,255,.7); }
  .band { background: var(--white); color: var(--ink); border: 0; box-shadow: 0 16px 40px -14px rgba(var(--a1r),.8); }
  .track svg { background: var(--tint); }
  .blk.oss { background: var(--white); color: var(--ink); backdrop-filter: none; box-shadow: 0 30px 60px -24px rgba(var(--a1r),.7); border-color: var(--white); }
  .oss .bar { background: linear-gradient(90deg, var(--a1), #e86bb4); border-bottom: 0; color: var(--white); }
  .oss a:hover, .proj a:hover { color: var(--pink); text-decoration-color: var(--pink); }
  .star { background: var(--blue); }
  .del { color: var(--pink); }
  .proj { background: var(--white); color: var(--ink); border: 0; box-shadow: 0 22px 44px -18px rgba(var(--a1r),.75); }
  .proj:hover { transform: translateY(-5px); box-shadow: 0 30px 50px -18px rgba(var(--a1r),.95); }
  .pm span { border: 1.5px solid var(--blue); }
  .pm .lang { background: var(--blue); color: var(--white); }
  .tile svg { border: 0; box-shadow: 0 10px 22px -8px rgba(var(--a1r),.9); }
  .tile:hover svg { box-shadow: 0 16px 26px -8px rgba(var(--a1r),1); }
  .lbar { border: 1.5px solid var(--white); }
  .sw { border: 0; }
  .heat text { fill: var(--white); }
  .heat rect[fill="var(--h4)"] { filter: drop-shadow(0 0 4px var(--a1)); }
  .foot { color: var(--white); opacity: .85; }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none !important; } }

  /* ---- v4: less white, deep-blue glass panels instead ---- */
  :root { --deep: rgba(3,44,68,.62); --h0: rgba(3,44,68,.38); --h1: rgba(143,214,239,.4); --h2: rgba(143,214,239,.78); --h3: #c4ebf8; --h4: var(--a1); }
  .links a { background: var(--pink); color: var(--white); box-shadow: 0 8px 22px -8px rgba(var(--a1r),.95); }
  .links a:hover { background: var(--white); color: var(--pink); }
  .band { background: #04304a; color: var(--white); box-shadow: 0 16px 40px -14px rgba(var(--a1r),.85); }
  .track svg { background: #cfeefa; }
  .blk.oss { background: var(--deep); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--white); border: 1.5px solid rgba(252,255,255,.3); box-shadow: 0 30px 60px -24px rgba(var(--a1r),.75), inset 0 1px 0 rgba(255,255,255,.25); }
  th { opacity: .8; }
  td { border-top: 1.5px solid rgba(252,255,255,.14); }
  tr:hover td { background: rgba(var(--a1r),.22); }
  .star { background: var(--pink); }
  .add { color: #8ff2c0; } .del { color: #ff9bd2; }
  .oss a:hover, .proj a:hover { color: #ffc2e3; text-decoration-color: #ffc2e3; }
  .proj { background: linear-gradient(155deg, rgba(3,44,68,.7), rgba(3,44,68,.45)); color: var(--white); border: 1.5px solid rgba(252,255,255,.3); box-shadow: 0 22px 44px -18px rgba(var(--a1r),.7); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .proj:hover { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 28px 50px -16px rgba(var(--a1r),1); }
  .pm span { border: 1.5px solid rgba(252,255,255,.45); }
  .pm .lang { background: var(--pink); border-color: var(--pink); color: var(--white); }
  .tile svg { background: #cfeefa; }
  .lbar { border-color: rgba(252,255,255,.55); }

  /* ---- v5: colour theory. Blue base, violet as the bridge hue to pink, apricot as the split-complement spark ---- */
  :root { --royal: rgba(var(--pcr),.42); --violet: var(--a2); --apricot: var(--sp); --apricot-soft: #ffe0a3; --h0: rgba(252,255,255,.16); --h1: var(--lb); --h2: #5b8cf0; --h3: #9a63ea; --h4: var(--a1); }
  body { background: linear-gradient(165deg, #1bb3e6 0%, #0593c6 38%, #1479c8 100%) fixed; }
  .b2 { background: var(--violet); opacity: .5; }
  .b3 { width: 380px; height: 380px; bottom: 5%; right: -110px; background: var(--sp); opacity: .22; filter: blur(110px); animation: drift 26s ease-in-out infinite alternate; }
  .blk { background: rgba(252,255,255,.14); border-color: rgba(252,255,255,.55); }
  .hero { background: linear-gradient(150deg, rgba(252,255,255,.24), rgba(var(--a2r),.14)); }
  h1 { text-shadow: 0 0 46px rgba(var(--a1r),.95), 0 0 80px rgba(var(--a2r),.5), 0 6px 26px rgba(10,70,140,.45); }
  .links a:hover { background: var(--apricot); color: var(--ink); }
  .curve .c1 { stroke: var(--apricot-soft); filter: drop-shadow(0 0 6px rgba(var(--spr),.85)); }
  .proof { background: linear-gradient(155deg, rgba(var(--a1r),.9) 0%, rgba(var(--a2r),.7) 55%, rgba(var(--a2r),.55) 100%); }
  .proof .row.big b { color: var(--apricot-soft); text-shadow: 0 0 26px rgba(var(--spr),.7); }
  .band { background: linear-gradient(90deg, var(--pc), var(--a2) 50%, var(--a1)); color: var(--white); border: 0; box-shadow: 0 16px 40px -14px rgba(var(--a2r),.8); }
  .track span::after { color: var(--apricot-soft); }
  .track svg { background: #e4f4fb; }
  .blk.oss { background: var(--royal); border: 1.5px solid rgba(252,255,255,.45); box-shadow: 0 30px 60px -24px rgba(var(--a2r),.8), inset 0 1px 0 rgba(255,255,255,.35); }
  .oss .bar { background: linear-gradient(90deg, var(--a1), #8e55d8); }
  td { border-top-color: rgba(252,255,255,.2); }
  tr:hover td { background: rgba(var(--a2r),.35); }
  .star { background: var(--apricot); color: var(--ink); }
  .add { color: #8ff5cf; } .del { color: #ffb0da; }
  .proj { background: linear-gradient(155deg, rgba(var(--pcr),.5), rgba(var(--a2r),.32)); border: 1.5px solid rgba(252,255,255,.45); box-shadow: 0 22px 44px -18px rgba(var(--a2r),.8); }
  .proj:hover { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 28px 50px -16px rgba(var(--a1r),1); }
  .pm span { border-color: rgba(252,255,255,.55); }
  .pm span:nth-child(2) { color: var(--apricot-soft); border-color: var(--apricot); }
  .tile svg { background: #e4f4fb; box-shadow: 0 10px 22px -8px rgba(var(--a2r),.95); }
  .tile:hover svg { box-shadow: 0 16px 26px -8px rgba(var(--a1r),1); }
  .heat rect[fill="var(--h3)"] { filter: drop-shadow(0 0 3px rgba(var(--a2r),.9)); }
  @media (prefers-reduced-motion: reduce) { .b3 { animation: none !important; } }

  /* ---- v6: everything themeable ---- */
  body { background: var(--bg) fixed; }
  .band { background: var(--band); }
  .proof, .oss .bar, .links a, .pm .lang { color: var(--pt); }
  .star { color: var(--ink); }
  .themes { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; padding: 6px; border-radius: 99px; background: rgba(0,0,0,.42); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.35); max-width: calc(100vw - 20px); overflow-x: auto; }
  .themes button { font: 500 13px "DM Mono", monospace; color: #fff; background: transparent; border: 1.5px solid transparent; border-radius: 99px; padding: 6px 14px 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .themes button:hover { background: rgba(255,255,255,.12); }
  .themes button[aria-pressed="true"] { border-color: #fff; background: rgba(255,255,255,.2); }
  .themes button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .sd { display: inline-flex; } .sd i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.8); margin-left: -4px; } .sd i:first-child { margin-left: 0; }
  main { padding-bottom: 36px; }
</style>
<script>
  (function () {
    var s = document.documentElement.style;
    var T = { bg: 'linear-gradient(165deg,#040a18 0%,#08203f 50%,#05364f 100%)', a1: '#0593c6', a2: '#5b50e6', pc: '#0a6ea0', sp: '#ffd23f',
      spsoft: '#ffe58f', lb: '#6fd8f7', soft: '#9ae6fb', blue: '#0593c6', ink: '#031325', pt: '#ffffff',
      band: 'linear-gradient(90deg,#0a3d6b,#5b50e6 55%,#0593c6)',
      h: ['rgba(255,255,255,.1)', '#0a4f78', '#0593c6', '#22c8f2', '#8af4ff'] };
    var rgb = function (h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }).join(','); };
    s.setProperty('--bg', T.bg);
    ['a1', 'a2', 'pc', 'sp'].forEach(function (n) { s.setProperty('--' + n, T[n]); s.setProperty('--' + n + 'r', rgb(T[n])); });
    s.setProperty('--apricot-soft', T.spsoft); s.setProperty('--lb', T.lb); s.setProperty('--soft', T.soft);
    s.setProperty('--blue', T.blue); s.setProperty('--ink', T.ink); s.setProperty('--pt', T.pt); s.setProperty('--band', T.band);
    T.h.forEach(function (c, i) { s.setProperty('--h' + i, c); });
  })().catch(() => {
  document.getElementById('app').innerHTML = '<section class="blk" style="grid-column:1/-1">Could not load data.json. Run the Update dashboard workflow once to generate it.</section>';
  document.body.dataset.ready = '1';
});
</script>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main><div class="grid" id="app"></div></main>

<script>
(async function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const date = (d) => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const short = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n));

  const LOGO = {
    python: '<svg viewBox="0 0 24 24"><path d="M12 2c-4 0-4 1.8-4 3v2h4v1H5.5C3.5 8 2 9.5 2 12.5s1.4 4.5 3.2 4.5H7v-2.5C7 13 8.5 12 10 12h4c1.3 0 2-1 2-2V5c0-1.5-1.8-3-4-3z" fill="#3776ab"/><path d="M12 22c4 0 4-1.8 4-3v-2h-4v-1h6.5c2 0 3.5-1.5 3.5-4.5S20.6 7 18.8 7H17v2.5c0 1.5-1.5 2.5-3 2.5h-4c-1.3 0-2 1-2 2v5c0 1.5 1.8 3 4 3z" fill="#ffd43b"/><circle cx="9.5" cy="5" r=".9" fill="#fff"/><circle cx="14.5" cy="19" r=".9" fill="#fff"/></svg>',
    jupyter: '<svg viewBox="0 0 24 24"><path d="M4 9c2-2.5 5-3.5 8-3.5s6 1 8 3.5c-2 2-5 2-8 2S6 11 4 9z" fill="#f37726"/><path d="M4 15c2 2.5 5 3.5 8 3.5s6-1 8-3.5c-2-2-5-2-8-2s-6 0-8 2z" fill="#f37726"/><circle cx="19" cy="4" r="1.5" fill="#767677"/><circle cx="5" cy="20" r="1.2" fill="#767677"/><circle cx="4" cy="5" r="1" fill="#9e9e9e"/></svg>',
    numpy: '<svg viewBox="0 0 24 24"><path d="M12 2l8 4.5-8 4.5-8-4.5z" fill="#4dabcf"/><path d="M4 6.5l8 4.5v10l-8-4.5z" fill="#4d77cf"/><path d="M20 6.5l-8 4.5v10l8-4.5z" fill="#013243"/></svg>',
    pandas: '<svg viewBox="0 0 24 24"><rect x="4" y="8" width="3.5" height="12" fill="#150458"/><rect x="4" y="4" width="3.5" height="3" fill="#ffca00"/><rect x="10.2" y="3" width="3.5" height="18" fill="#150458"/><rect x="10.2" y="10" width="3.5" height="3" fill="#e70488"/><rect x="16.5" y="4" width="3.5" height="12" fill="#150458"/><rect x="16.5" y="17.5" width="3.5" height="3" fill="#e70488"/></svg>',
    scikitlearn: '<svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="7" fill="#f89939"/><circle cx="15" cy="12" r="7" fill="#29abe2" opacity=".85"/></svg>',
    pytorch: '<svg viewBox="0 0 24 24"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 1.5 1 2 1.5 2C11 7 12 5 12 2z" fill="#ee4c2c"/><circle cx="15.5" cy="5" r="1.3" fill="#ee4c2c"/></svg>',
    git: '<svg viewBox="0 0 24 24"><path d="M12 1.5L22.5 12 12 22.5 1.5 12z" fill="#f05032"/><path d="M9 9v6M9 10.5l6 1.5" stroke="#fff" stroke-width="1.2" fill="none"/><circle cx="9" cy="9" r="1.7" fill="#fff"/><circle cx="9" cy="15" r="1.7" fill="#fff"/><circle cx="15" cy="12" r="1.7" fill="#fff"/></svg>',
    github: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#181717"/><path d="M8 17c0-2 1-2.5 1-3.5C7 13 6.5 11.5 7 10c.3-.8.8-1 .8-1.800 0-.6.2-1 .2-1 .8 0 1.600.5 2 1 1.300-.4 2.700-.4 4 0 .4-.5 1.200-1 2-1 0 0 .2.4.2 1 0 .8.5 1 .8 1.800.5 1.500 0 3-2 3.500 0 1 1 1.500 1 3.500z" fill="#fff"/></svg>'
  };

  const res = await fetch('data.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  const d = await res.json();
  const c = d.config, u = d.user;
  const skills = c.skills || [];
  const hide = new Set(c.hideLanguages || ['Jupyter Notebook']);

  const hero = `<section class="blk hero">
    <div class="top"><img src="${esc(u.avatar)}" alt=""><span>@${esc(u.login)} · ${u.followers} followers</span></div>
    <h1>${esc((c.name || u.login).toLowerCase())}<i></i></h1>
    <p class="tag">${esc(c.tagline || u.bio || '')}</p>
    <div class="links">${(c.links || []).map((l) => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join('')}</div>
    <svg class="curve" viewBox="0 0 640 150" aria-hidden="true">
      <g stroke="rgba(6,42,56,.3)" stroke-width="1.5" stroke-dasharray="3 6"><line x1="0" y1="35" x2="640" y2="35"/><line x1="0" y1="85" x2="640" y2="85"/><line x1="0" y1="135" x2="640" y2="135"/></g>
      <path class="c1" pathLength="1" d="M4 14 C70 20 90 96 160 112 S320 134 636 138"/>
      <path class="c2" pathLength="1" d="M4 32 C80 40 120 94 190 108 S340 120 636 122"/>
      <circle class="dot" cx="636" cy="138" r="7" fill="var(--a1)" stroke="#062a38" stroke-width="2.5"/>
    </svg>
    <div class="log"><span>epoch <b id="ep">0</b>/128</span><span>train_loss <b id="tl">1.900</b></span><span>val_loss <b id="vl">2.100</b></span></div>
  </section>`;

  const rows = [['external_prs_merged', d.oss.total, 'big'], ['contributions_12mo', d.stats.contributions], ['repos_contributed_to', d.oss.repos], ['stars_earned', d.stats.stars], ['code_reviews', d.stats.reviews]];
  const proof = `<section class="blk proof">${rows.map((r) => `<div class="row ${r[2] || ''}"><span>${r[0]}</span><b data-v="${r[1]}">${short(r[1])}</b></div>`).join('')}</section>`;

  const mq = skills.map((s) => `<span>${LOGO[s.icon] || ''}${esc(s.name)}</span>`).join('');
  const band = `<div class="band" aria-hidden="true"><div class="track">${mq}${mq}${mq}${mq}</div></div>`;

  const items = d.oss.items;
  const oss = `<section class="blk oss">
    <div class="bar"><h2><span class="live"></span>Open source contributions</h2><p>${d.oss.total} merged PRs in other people's repos</p></div>
    <div class="inner">${items.length ? `<div class="scroll"><table>
      <thead><tr><th>repository</th><th>merged pull request</th><th>stars</th><th>merged</th><th>lines</th></tr></thead>
      <tbody>${items.map((i) => `<tr>
        <td class="repo"><a href="${esc(i.repoUrl)}">${esc(i.repo)}</a></td>
        <td><a href="${esc(i.url)}">${esc(i.title)}</a></td>
        <td class="num"><span class="star">★ ${short(i.stars)}</span></td>
        <td class="num">${date(i.mergedAt)}</td>
        <td class="num"><span class="add">+${short(i.additions)}</span> <span class="del">−${short(i.deletions)}</span></td></tr>`).join('')}</tbody></table></div>`
      : `<p class="empty">No merged pull requests in other people's repositories yet. The first one lands here on the next refresh.</p>`}</div>
  </section>`;

  const impact = c.impact || {};
  const projects = `<div class="projects">${d.pinned.map((p) => `<article class="proj">
      <h3><a href="${esc(p.url)}">${esc(p.name)}</a></h3>
      <p>${esc(impact[p.name] || p.description || '')}</p>
      <div class="pm">${p.language && !hide.has(p.language.name) ? `<span class="lang">${esc(p.language.name)}</span>` : ''}<span>★ ${short(p.stars)}</span>${p.forks ? `<span>${p.forks} forks</span>` : ''}<span>pushed ${date(p.pushedAt)}</span></div>
    </article>`).join('')}</div>`;

  const skillsBlk = `<section class="blk skills"><h2>Skills</h2><p class="sub">The tools behind the projects.</p>
    <div class="tiles">${skills.map((s) => `<div class="tile">${LOGO[s.icon] || ''}${esc(s.name)}</div>`).join('')}</div></section>`;

  const pal = ['var(--lb)', 'var(--a1)', 'var(--a2)', 'var(--sp)', 'var(--soft)', 'var(--pc)'];
  const L = d.languages.filter((l) => !hide.has(l.name));
  const tot = L.reduce((s, l) => s + l.pct, 0) || 1;
  L.forEach((l) => { l.pct = (l.pct / tot) * 100; });
  const top = L.slice(0, 5), rest = L.slice(5).reduce((s, l) => s + l.pct, 0);
  const all = rest > 0.5 ? top.concat([{ name: 'Other', pct: rest }]) : top;
  const langs = `<section class="blk langs"><h2>Languages</h2><p class="sub">By bytes of code, public repos. Notebooks excluded.</p>
    <div class="lbar" role="img" aria-label="Language share">${all.map((l, i) => `<span style="animation-delay:${i * 120}ms;width:${l.pct}%;background:${pal[i]}"></span>`).join('')}</div>
    <div class="leg">${all.map((l, i) => `<div><span class="sw" style="background:${pal[i]}"></span>${esc(l.name)}<em>${l.pct.toFixed(1)}%</em></div>`).join('')}</div></section>`;

  const weeks = d.calendar, S = 11, G = 3, step = S + G, top0 = 16;
  const max = Math.max(1, ...weeks.flat().map((x) => x.count));
  const lvl = (n) => (n === 0 ? 0 : Math.min(4, Math.ceil((4 * n) / max)));
  let prev = '', lab = '', rects = '';
  weeks.forEach((w, x) => {
    const m = new Date(w[0].date + 'T00:00:00Z').toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' });
    if (m !== prev) { lab += `<text x="${x * step}" y="10">${m}</text>`; prev = m; }
    w.forEach((day, y) => { rects += `<rect x="${x * step}" y="${top0 + y * step}" width="${S}" height="${S}" rx="2.5" style="animation-delay:${x * 18 + 300}ms" fill="var(--h${lvl(day.count)})"><title>${day.count} contributions on ${date(day.date)}</title></rect>`; });
  });
  const act = `<section class="blk act"><h2>Activity</h2><p class="sub">${d.stats.contributions} contributions in the last year: ${d.stats.commits} commits, ${d.stats.prs} pull requests, ${d.stats.reviews} reviews. Pink marks the busiest days.</p>
    <svg class="heat" viewBox="0 0 ${weeks.length * step - G} ${top0 + 7 * step - G}" role="img" aria-label="Contribution calendar">${lab}${rects}</svg></section>`;

  document.title = `${c.name || u.login} · developer dashboard`;
  document.getElementById('app').innerHTML = hero + proof + band + oss + projects + skillsBlk + langs + act +
    `<div class="foot">Updated ${date(d.generatedAt)}. Refreshed every 6 hours with GitHub Actions.</div>`;

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ep = document.getElementById('ep'), tl = document.getElementById('tl'), vl = document.getElementById('vl');
  const run = (ms, fn) => { const t0 = performance.now(); const f = (t) => { const p = Math.min(1, (t - t0) / ms); fn(1 - Math.pow(1 - p, 3)); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); };
  const setLog = (e) => { ep.textContent = Math.round(128 * e); tl.textContent = (1.9 - 1.858 * e).toFixed(3); vl.textContent = (2.1 - 2.019 * e).toFixed(3); };
  if (still) setLog(1); else run(2600, setLog);
  document.querySelectorAll('b[data-v]').forEach((el) => {
    const v = +el.dataset.v;
    if (!still) run(1400, (e) => { el.textContent = short(Math.round(v * e)); });
  });
  document.body.dataset.ready = '1';
})().catch(() => {
  document.getElementById('app').innerHTML = '<section class="blk" style="grid-column:1/-1">Could not load data.json. Run the Update dashboard workflow once to generate it.</section>';
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
